# apps/guojin/env.yaml —— 团队内自测环境声明（轻量档 trusted_internal）。
# 国金为已知模拟盘、团队内自测：assurance_level=trusted_internal 即解锁 simulated_submit，
# 不需要 HMAC 签名/个人署名/有效期。要临时锁死改 revoked:true 即回退 confirm_only。
# 将来若要驱动真实账户/生产，改用 assurance_level=operator_attested + .secrets 密钥签名
# （见 env.yaml.example 与 .secrets/README.md，该严格路径代码仍在、随时可启）。
type: simulation
assurance_level: trusted_internal
evidence:
  package: com.hexin.plat.android.GuoJinZXGSecurity
  version_range: {min: "8.05.001", max_exclusive: "8.06.000"}
  account_aliases: [pt, xy]
revoked: false
