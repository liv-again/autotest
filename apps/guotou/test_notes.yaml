version: 1
app: guotou

notes:
  - key: quote.data_integrity_only
    scope: quote.validation
    level: warning
    when: 行情校验的预期结果中出现“数据正确”“数据一致”或类似表述
    instruction: 仅校验数据完整性：确认预期字段均有展示、有值、未缺失、未截断或明显乱码
    do_not_check:
      - 与外部行情源或人工预期值逐项比对
      - 不同页面或不同区域之间的数值一致性
      - 仅凭“数据正确/数据一致”推断数值业务正确
    result_note: 若没有明确的预期值或权威数据源，只能按数据完整性判定，并在 actual 中注明校验范围

  - key: quote.top_level_tab_identity
    scope: quote.navigation
    level: required
    when: 判断股指、沪深京、板块、港股或其他页面是否为行情顶层页时
    instruction: 行情顶层页包含五个 Tab：首页顶部标题栏必须显示对应名称“股指”“沪深京”“板块”“港股”或“其他”；通过顶部标题栏名称确认当前具体顶层页，再执行该行操作
    do_not_check:
      - 不要仅凭通用容器、顶部 Tab 选中状态或页面存在行情控件判定已进入目标页
      - 不要把这五个行情顶层页误判为个股详情页、列表子页或搜索页
    result_note: 页面校验时记录实际顶部标题栏名称；若名称不匹配目标 Tab，先导航并重新校验，复核失败则阻塞且不执行本行动作

  - key: quote.multi_entry_home_navigation
    scope: quote.navigation
    level: required
    when: 同一行需要从行情首页依次打开多个入口，例如“行业板块、AH股、港股主板、港股创业板”
    instruction: 每个入口都是独立子动作；打开一个子页面后，必须先恢复对应行情首页，再查找并点击下一个入口。入口查找按当前可见区域、回到顶部、向下区域的有限顺序执行，并在每次点击后复核目标子页面
    do_not_check:
      - 不要在已进入第一个子页面后继续点击行情首页入口
      - 不要因某一个入口点击成功就推断同一行的其他入口也已执行
      - 不要无限滑动、返回或重复点击来掩盖入口缺失
    result_note: 任一入口恢复来源页失败、找不到或目标子页复核失败，立即阻塞该行并保留已执行的 action_trace 与截图
