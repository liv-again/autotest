verified_chains:
- key: chain.zhongyuan.cold_start_recovery
  steps:
  - 软复位或根页面门禁失败时重新冷启动中原App
  - 等待广告/故障公告稳定
  - 点击 tv_dialog_ok（文字“确定”）关闭公告
  - 底部进入行情并点击 right_radio
  - 按目标进入全球或A股→沪深京
  - 目标页等待约8–10秒后用稳定页面ID和选中页签确认
  last_verified: '2026-09-19'
  evidence_run: output/2026-09-19-zhongyuan-guzhi-hushenjing-rerun-v3
  status: verified
