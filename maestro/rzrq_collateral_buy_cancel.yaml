# 融资融券(两融) · 担保品限价买入 → 撤单（国金证券）
# 前置：已登录【信用/两融账号】(如股东***2927) / 交易时段 / BUY_CODE 为该信用账户可作担保品的北交所ETF
# 策略：跌停价委托 → 必挂已报不成交 → 撤单 → 账户零残留
# ⚠️ 选择器均来自 2026-07-29 实时 uiautomator 校验；Maestro 未安装，跑前需 `maestro test` 验证。
# ⚠️ 共享账户：撤单只撤本 flow 刚下的单(index 0=最新)，别误撤他人单。
appId: com.hexin.plat.android.GuoJinZXGSecurity
env:
  BUY_CODE: "950025"
  QTY: "100"
---
- launchApp
# ---- 交易 → 融资融券(两融)子tab → 担保品买入 ----
- tapOn: "交易"
- tapOn:
    id: "tv_tab_rzrq"          # 顶部「融资融券」子tab
- tapOn:
    id: "tv_menu_text"
    text: "担保品买入"
- assertVisible:
    id: "auto_stockcode"
# ---- 输入代码 → 点下拉建议项回填 ----
- tapOn:
    id: "auto_stockcode"
- inputText: "${BUY_CODE}"
- tapOn:
    text: "${BUY_CODE}"        # 下拉建议行(stock_code_tv)，点选才回填
- assertVisible:
    id: "couldbuy"             # 回填成功(可买--股)
# ---- 委托价 = 跌停价(不成交、可撤)。注:dietingprice 文本含「跌停」前缀,若校验失败见 README 已知坑 ----
- copyTextFrom:
    id: "dietingprice"
- tapOn:
    id: "stockprice"
- eraseText
- inputText: "${maestro.copiedText}"
- hideKeyboard
# ---- 数量 ----
- tapOn:
    id: "stockvolume"
- inputText: "${QTY}"
- hideKeyboard
# ---- 提交(连贯：担保品买入→确认买入，防「请勿重复提交」锁) ----
- tapOn:
    id: "btn_buy"              # 「担保品买入」提交
- tapOn: "确认买入"            # 确认框「确认买入」(信用买入委托)
- assertVisible: "委托成功"    # 委托成功，合同号为：X
- tapOn: "确定"                # 结果框「确定」
# ---- 撤单：菜单撤单 → 撤最新一条 → 确认 ----
- tapOn:
    id: "tv_menu_text"
    text: "撤单"
- tapOn:
    id: "dragablelistviewitem" # 委托撤单列表第一条(最新在最上)
    index: 0
- tapOn: "确定"                # 撤单确认框「确定」
- assertVisible: "提交成功"    # 提交成功，合同号：X
- tapOn: "确定"
