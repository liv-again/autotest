# Planning-stage Agent/model defaults.
#
# ``model`` is the exact wire identifier expected by the selected runtime,
# rather than a display name.  Override it per process with
# SIXGILL_PLANNER_MODEL when another Agent/runtime is intentionally selected.
schema_version: "1.0"
planner:
  model: "gpt-5.6-luna"
  model_env: "SIXGILL_PLANNER_MODEL"

# Retesting and result review inherit planner.agent/model at runtime. Retesting
# keeps one session for a queue while review remains an independent read-only
# session. Provider integration is deliberately external
# to this file so the workflow is not tied to Codex, OpenCode, Trae, or Claude.
# Optional role-specific overrides are SIXGILL_RETEST_AGENT_NAME /
# SIXGILL_RETEST_MODEL and SIXGILL_REVIEW_AGENT_NAME / SIXGILL_REVIEW_MODEL.
retester:
  prompt_version: "row-retest-v1"
  session_policy: "new_per_queue"
reviewer:
  prompt_version: "row-review-v1"
  session_policy: "new_readonly"
