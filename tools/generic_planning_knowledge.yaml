schema_version: "1.0"
scope: cross_app
title: 通用行情列表与页面观察规划技巧
usage:
  - 仅在当前用例涉及横屏列表、列表滑动、目标元素查找或列表排序时采用。
  - 这些规则是跨 App 的观察和规划指导，不是固定坐标；控件、容器和滑动范围必须由当前页面的 UI 树或截图动态确定。
  - 规划时应把关键的前后观察写入 action plan 的 observe/expected_observations，并由截图和事实链复核，不能只依据点击或滑动动作返回成功。
techniques:
  - id: landscape_list_title_visibility
    name: 横屏列表页标题可能不显示
    applies_to:
      - landscape_list_page
    rule: 列表页面切换横屏后可能不显示页面标题。
    planning_guidance:
      - 横屏列表目标页校验不能把页面标题作为唯一必要条件。
      - 应组合使用屏幕方向、页面专属 resource-id/控件、表头、列表容器和可见数据等稳定特征确认目标页。
      - 若标题属于预期展示内容，单独记录为可观察结果；标题缺失不能直接推断横屏切换失败。

  - id: scroll_effect_by_first_stock
    name: 用第一行股票名称和代码确认滑动生效
    applies_to:
      - stock_list_scroll
    rule: 列表滑动后，观察列表第一行股票；第一行股票名称和股票代码的组合发生变化，即判定滑动生效。
    planning_guidance:
      - 滑动前先 observe 并记录当前列表第一行的股票名称和股票代码。
      - 执行一次屏幕级滑动后再次 observe，并记录滑动后的第一行股票名称和股票代码。
      - 对比滑动前后的第一行名称/代码组合；组合变化才可判定滑动生效，不能仅以 swipe 返回成功判定。
      - 截图或视觉识别无法读出前后两行时，结果应标记为待验证，而不是猜测通过。

  - id: target_element_search_after_page_confirm
    name: 目标页已确认但元素未找到时有限滑动查找
    applies_to:
      - target_element_missing
    rule: 已确认进入目标页但未找到目标元素时，先回到最顶部，再最多下划三个屏幕距离；每次滑动后寻找一次。
    planning_guidance:
      - 先在当前可见区域查找目标元素；未找到时先滑动到列表或页面顶部并再次查找。
      - 顶部仍未找到时，最多向下滑动三个屏幕距离，每次滑动完成后立即重新查找一次。
      - 查找顺序固定为当前可见区域、顶部、向下第 1 屏、第 2 屏、第 3 屏；不要无限滑动、盲点坐标或重复整段导航。
      - 三次下划后仍未找到时，应记录目标元素缺失并阻塞/待验证，不得继续执行依赖该元素的动作。

  - id: list_sort_by_first_two_rows
    name: 用前两条数据验证列表排序
    applies_to:
      - sortable_stock_list
    rule: 点击指定字段表头前后比较列表前两条数据；前两条发生变化且指定字段顺序与点击前相反，才判定排序生效。
    planning_guidance:
      - 点击表头前先 observe 并记录列表前两条数据及指定字段值。
      - 点击指定字段表头后再次 observe，记录排序后的前两条数据及同一字段值。
      - 同时确认前两条数据发生变化，并确认指定字段的顺序与点击前相反；两项都满足才判定排序生效。
      - 数据未变化、字段值无法读取或只看到点击成功时，应标记为待验证/阻塞，不能判定排序通过。
